name: Site data

# Manual only. Rebuilds docs/data.js from the files in data/runs/ and commits it,
# so the demo site shows the latest recorded runs. No keys, no network calls.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild docs/data.js
        run: node src/site/build-data.ts
      - name: Commit if changed
        run: |
          git config user.name "crashcart-bot"
          git config user.email "crashcart-bot@users.noreply.github.com"
          git add docs/data.js
          git diff --cached --quiet || git commit -m "Rebuild site data"
          git push
